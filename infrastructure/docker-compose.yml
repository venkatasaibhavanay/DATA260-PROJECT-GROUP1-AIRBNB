# DATA 260 Group 1 — local infrastructure (MySQL, MongoDB, Redis, Kafka/KRaft).
# Run through the helper so the root .env is used:
#   ./scripts/infra.sh up | down | status | logs [service] | restart [service]
# All host ports are bound to 127.0.0.1 only.
name: ${COMPOSE_PROJECT_NAME:-data260-group1}

services:
  mysql:
    image: mysql:8.4
    container_name: data260-g1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-airbnb_group1}
      MYSQL_USER: ${MYSQL_USER:-group1_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3311}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [g1_net]

  mongodb:
    image: mongo:7.0
    container_name: data260-g1-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-group1_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-airbnb_group1}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27101}:27017"
    volumes:
      - mongo_data:/data/db
      - ../database/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [g1_net]

  redis:
    image: redis:7.4-alpine
    container_name: data260-g1-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [g1_net]

  kafka:
    image: apache/kafka:3.9.1
    container_name: data260-g1-kafka
    restart: unless-stopped
    user: "0:0"   # lets the broker write to the named volume
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL (container 9092) is published on host :9091 and advertised as localhost:9091.
      # INTERNAL (29092) is for containers on g1_net: kafka:29092.
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT:-9091},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ZGF0YTI2MGdyb3VwMWth
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9091}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [g1_net]

  # One-shot job: creates domain topics + .dlq topics from shared/kafka/topics.txt, then exits.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: data260-g1-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
      TOPICS_FILE: /config/topics.txt
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
      - ../shared/kafka/topics.txt:/config/topics.txt:ro
    restart: "no"
    networks: [g1_net]

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  kafka_data:

networks:
  g1_net:
    name: data260-group1-net
